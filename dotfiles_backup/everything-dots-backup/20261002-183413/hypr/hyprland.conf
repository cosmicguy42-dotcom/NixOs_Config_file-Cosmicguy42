source = colors.conf

### MONITORS ###
monitor = eDP-1, 1920x1080@144.42, 0x0, 1
monitor = , preferred, auto, 1

### MY PROGRAMS ###
$terminal = kitty
$fileManager = nautilus
$menu = rofi-launcher

### AUTOSTART ###
exec-once = nm-applet --indicator
exec-once = waybar  
exec-once = swww-daemon --format xrgb
exec-once = swaync
exec-once = hypridle

### ENVIRONMENT VARIABLES ###
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = BROWSER,zen

### TAGS ###
source = ~/.config/hypr/configs/tags.conf

### LOOK AND FEEL ###
source = ~/.config/hypr/configs/looknfeel.conf

### ANIMATIONS ###
source = ~/.config/hypr/configs/UserAnimations.conf

### WINDOWRULES AND LAYERRULES ###
source = ~/.config/hypr/configs/windowrules.conf

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

render {
    direct_scanout = 0
}

### INPUT ###
source = ~/.config/hypr/configs/input.conf

### KEYBINDS ###
source = ~/.config/hypr/configs/keybinds.conf
