# Minimal lock screen. Colours + wallpaper: hyprlock/colors.conf (matugen)
source = ~/.config/hypr/hyprlock/colors.conf
source = ~/.config/hypr/hyprlock/shape.conf

general {
    hide_cursor = true
}

background {
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

label { # Time
    text = $TIME
    color = $fg
    font_size = 110
    font_family = Instrument Serif
    position = 0, 210
    halign = center
    valign = center
}

label { # Date
    text = cmd[update:60000] date +"%A  %d %B" | tr '[:lower:]' '[:upper:]'
    color = $dim
    font_size = 12
    font_family = Space Mono
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    size = 280, 48
    rounding = $rounding
    outline_thickness = 1
    outer_color = $outline
    inner_color = $field
    font_color = $fg
    check_color = $accent
    fail_color = $error
    font_family = Space Mono
    placeholder_text = PASSWORD
    fail_text = <i>$FAIL</i>
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

shape { # accent dot
    size = 8, 8
    rounding = $rounding
    color = $accent
    position = 0, -110
    halign = center
    valign = center
}
