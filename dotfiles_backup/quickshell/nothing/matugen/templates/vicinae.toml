# Vicinae theme for the "nothing" shell - rendered by scripts/render.py into
# ~/.local/share/vicinae/themes/nothing.toml (vicinae hot-reloads it).
# Based on vicinae's official matugen template, adjusted to the shell's
# rules: neutral glass, white selection, the accent only for small signals.
[meta]
name = "Nothing"
description = "Everything-dots · {{mode}}"
variant = "{{mode}}"
inherits = "vicinae-{{mode}}"

[colors.core]
accent = "{{colors.primary.default.hex}}"
accent_foreground = "{{colors.on_primary.default.hex}}"
background = "{{colors.surface_container_lowest.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
secondary_background = "{{colors.surface_container.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"

[colors.main_window]
border = "{{colors.outline_variant.default.hex}}"

[colors.settings_window]
border = "{{colors.outline_variant.default.hex}}"

[colors.accents]
blue = "{{colors.primary.default.hex}}"
green = "{{colors.tertiary.default.hex}}"
magenta = "{{colors.secondary.default.hex}}"
orange = { name = "{{colors.error.default.hex}}", lighter = 40 }
red = "{{colors.error.default.hex}}"
yellow = { name = "{{colors.tertiary.default.hex}}", lighter = 80 }
cyan = { name = "{{colors.primary.default.hex}}", lighter = 50 }
purple = "{{colors.secondary.default.hex}}"

[colors.text]
default = "{{colors.on_surface.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
danger = "{{colors.error.default.hex}}"
success = "{{colors.tertiary.default.hex}}"
placeholder = { name = "{{colors.on_surface_variant.default.hex}}", opacity = 0.6 }

[colors.text.selection]
background = "{{colors.on_surface.default.hex}}"
foreground = "{{colors.surface_container_lowest.default.hex}}"

[colors.text.links]
default = "{{colors.primary.default.hex}}"
visited = { name = "{{colors.tertiary.default.hex}}", darker = 20 }

[colors.input]
border = "{{colors.outline_variant.default.hex}}"
border_focus = "{{colors.on_surface_variant.default.hex}}"
border_error = "{{colors.error.default.hex}}"

[colors.button.primary]
background = "{{colors.surface_container_high.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.button.primary.hover]
background = "{{colors.surface_container_highest.default.hex}}"

[colors.button.primary.focus]
outline = "{{colors.on_surface_variant.default.hex}}"

# Selection: a raised neutral surface, never accent-tinted. (Solid colours:
# vicinae renders translucent list highlights nearly opaque.)
[colors.list.item.hover]
background = "{{colors.surface_container.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.list.item.selection]
background = "{{colors.surface_container_highest.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
secondary_background = "{{colors.surface_bright.default.hex}}"
secondary_foreground = "{{colors.on_surface.default.hex}}"

[colors.grid.item]
background = "{{colors.surface_container.default.hex}}"

[colors.grid.item.hover]
outline = { name = "{{colors.on_surface.default.hex}}", opacity = 0.3 }

[colors.grid.item.selection]
outline = { name = "{{colors.on_surface.default.hex}}", opacity = 0.8 }

[colors.scrollbars]
background = { name = "{{colors.on_surface.default.hex}}", opacity = 0.15 }

[colors.loading]
bar = "{{colors.primary.default.hex}}"
spinner = "{{colors.primary.default.hex}}"
