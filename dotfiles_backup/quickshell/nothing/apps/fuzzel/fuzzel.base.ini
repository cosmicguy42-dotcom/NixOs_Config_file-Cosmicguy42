# Fuzzel config used only inside Hyprland (bin/fuzzel wrapper passes --config).
include=~/.local/state/nothing/fuzzel-colors.ini
font=Space Mono:size=10
icon-theme=Papirus-Dark
terminal=kitty -1 --instance-group nothing
prompt=""
placeholder=Search
layer=overlay
anchor=top
y-margin=60
width=36
lines=8
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=22
icons-enabled=yes

[border]
radius=@RADIUS@
width=1
selection-radius=@SELRADIUS@

[dmenu]
exit-immediately-if-empty=yes
