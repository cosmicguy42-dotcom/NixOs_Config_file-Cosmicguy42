# Kitty config used only inside Hyprland (KITTY_CONFIG_DIRECTORY points here).
# Defaults first; your own ~/.config/kitty/kitty.conf (if any) overrides them;
# the wallpaper colours and translucency always win.

font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 18
cursor_shape     beam
confirm_os_window_close 0
enable_audio_bell no

include ~/.config/kitty/kitty.conf

include ~/.local/state/nothing/kitty-colors.conf

# Slight translucency so Hyprland blur shows through
background_opacity 0.82

# Monochrome overrides (Noir, Blanc, Gris)
foreground            #f2f2f2
background            #050505
cursor                #f2f2f2
cursor_text_color     #050505
selection_foreground  #050505
selection_background  #d0d0d0
url_color             #ffffff
active_border_color   #ffffff
inactive_border_color #303030

# 16 ANSI colors (Monochrome: Black -> Grays -> White)
color0  #1a1a1a
color8  #555555
color1  #777777
color9  #999999
color2  #888888
color10 #aaaaaa
color3  #999999
color11 #bbbbbb
color4  #aaaaaa
color12 #cccccc
color5  #bbbbbb
color13 #dddddd
color6  #cccccc
color14 #eeeeee
color7  #e0e0e0
color15 #ffffff
